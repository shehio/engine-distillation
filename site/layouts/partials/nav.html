<script>
(function () {
  var btn = document.querySelector('.theme-toggle'), menu = document.querySelector('.nav-more');
  function current() {return document.documentElement.getAttribute('data-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');}
  function label() {btn.setAttribute('aria-label', 'Switch to ' + (current() === 'dark' ? 'light' : 'dark') + ' theme');}
  label();
  btn.addEventListener('click', function () {var next = current() === 'dark' ? 'light' : 'dark';document.documentElement.setAttribute('data-theme', next);try {localStorage.setItem('wm-theme', next);} catch (e) {}label();});
  document.addEventListener('click', function (e) {if (!menu.contains(e.target)) menu.open = false;});
  document.addEventListener('keydown', function (e) {if (e.key === 'Escape' && menu.open) {menu.open = false;menu.querySelector('summary').focus();}});
  document.querySelectorAll('.nav-links a').forEach(function (a) {if (new URL(a.href).pathname === location.pathname) a.setAttribute('aria-current', 'page');});
})();
</script>
